# Deploy Supabase migrations + critical edge functions when roundup updates.
# Requires GitHub secrets:
#   SUPABASE_ACCESS_TOKEN  – https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   – Project Settings → Database
# Optional:
#   SUPABASE_PROJECT_REF   – defaults to kgndpwzqohepotahnfeo

name: Deploy Supabase

on:
  push:
    branches: [roundup]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/deploy-e2e-fixes.sh'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy migrations + edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'kgndpwzqohepotahnfeo' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD GitHub secrets"
            exit 1
          fi
          chmod +x scripts/deploy-e2e-fixes.sh
          ./scripts/deploy-e2e-fixes.sh
