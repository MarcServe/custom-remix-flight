   name: CI
   on:
     push:
       branches: ['roundup']
     pull_request:
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: '20'
             cache: npm
         - run: npm install
         - run: npm run build
   ```

4. Commit that file to the `roundup` branch.

After the commit, GitHub will kick off the first workflow run and the Actions tab will show it. From then on, every push/PR will display there automatically.
